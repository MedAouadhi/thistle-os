dependencies:
  # The Tailscale client (tailnet_platform.c), only on the S3, which has the
  # PSRAM it allocates from. It is MicroLink as forked for hermes_esp32,
  # with eleven commits on top for ThistleOS on branch `thistle`, pinned to
  # an exact object so an upstream change cannot arrive without somebody
  # choosing it:
  #
  # - built against mbedTLS 3 (ESP-IDF 5.5) as well as mbedTLS 4;
  # - microlink_stop() waits for the client's tasks, so the tailnet can be
  #   switched off and on without freeing a context a task still uses, and
  #   a stop frees what the tasks left: sockets, TLS state, queued packets,
  #   the WireGuard device;
  # - a node without an auth key signs in at a URL (ML_STATE_NEEDS_LOGIN),
  #   and a refused or expired registration is reported, not retried for
  #   ever;
  # - the home DERP region is the nearest one measured, not Dallas;
  # - a packet that finds no WireGuard session starts one, so a plain
  #   socket reaches a peer that has not reached this device first;
  # - a stop ends waits it used to sit out, and the netif is added and
  #   removed on the TCPIP thread; DERP regions are measured once an hour,
  #   and a stale sign-in URL is given up for a new one;
  # - the WireGuard netif's link stays up with no session, so a packet for
  #   a peer still asks for one, and data goes through DERP until a direct
  #   path is proven, which over mobile data it never is;
  # - a session lapses once idle, with no keepalive to keep it, and a
  #   handshake to a peer with a direct path goes both ways at once;
  # - an idle tailnet is quiet: no keep-alives of its own to the control
  #   plane or DERP, which are reconnected after 120 s of silence instead;
  #   DISCO only to a peer whose session is in use; STUN every 23 s while
  #   one is and every 5 minutes otherwise; endpoints sent only when new.
  #
  # wireguard_lwip is named too because MicroLink lists it under
  # PRIV_REQUIRES, which the component manager does not follow. Moving the
  # pin on a tree that has built needs dependencies.lock deleted as well.
  microlink:
    git: https://github.com/MedAouadhi/microlink.git
    path: components/microlink
    version: 709ba05ff5a3d27a96258b33cea379964c752940
    rules:
      - if: "target == esp32s3"
  wireguard_lwip:
    git: https://github.com/MedAouadhi/microlink.git
    path: components/microlink/components/wireguard_lwip
    version: 709ba05ff5a3d27a96258b33cea379964c752940
    rules:
      - if: "target == esp32s3"
