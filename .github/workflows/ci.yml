name: CI

# Every push to main and every pull request, on GitHub's hosted runners: the
# firmware, built with no .env as a release is, and its size against the
# partition table; Recovery; the dependency audit and the scans. The host
# tests are tests.yml's.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  CARGO_BUILD_JOBS: 4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  THISTLE_CI_JOBS: 4

jobs:
  firmware:
    name: Build Firmware (${{ matrix.chip }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    strategy:
      fail-fast: false
      matrix:
        # The chips the firmware is built for, one a line.
        chip:
          - esp32s3
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # The tags: the firmware's version is a describe (tools/firmware_version.sh).
          fetch-depth: 0

      # .env holds the user's keys and addresses. What this job builds is
      # what a release publishes, so it must never see one.
      - name: No .env in the workspace
        shell: bash
        run: |
          if [ -e .env ]; then
            echo "::error::.env exists in the workspace; CI builds firmware without one"
            exit 1
          fi

      - name: Cache Rust ESP toolchain
        uses: actions/cache@v6
        with:
          path: |
            /root/.cargo
            /root/.rustup
            /root/export-esp.sh
          key: rust-esp-toolchain-v5-espup016

      - name: Install Rust ESP toolchain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain 1.85.0
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install 1.85.0 --profile minimal
          # Pinned to 0.16.0: 0.17.x aborts with "Unsuported file extension:
          # 'part'". CLAUDE.md pins the same.
          if [ "$(espup --version 2>/dev/null | awk '{print $2}')" != "0.16.0" ]; then
            cargo +1.85.0 install espup --version 0.16.0 --locked --force
          fi
          if [ ! -f "$HOME/export-esp.sh" ] || ! rustup run esp rustc --version >/dev/null 2>&1; then
            espup install
          fi
          # Not sourced here: export-esp.sh overrides ESP-IDF's GCC.
          # components/kernel_rs/CMakeLists.txt sources it for cargo alone.

      - name: Cache managed components and the Rust build
        uses: actions/cache@v6
        with:
          path: |
            managed_components
            components/kernel_rs/target
          key: espidf-v5.5-rust-${{ matrix.chip }}-${{ hashFiles('components/kernel_rs/Cargo.lock', 'components/kernel_rs/src/**', 'components/*/idf_component.yml', 'main/idf_component.yml') }}
          restore-keys: |
            espidf-v5.5-rust-${{ matrix.chip }}-

      - name: Build firmware
        shell: bash
        env:
          CHIP: ${{ matrix.chip }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export PATH="$HOME/.cargo/bin:$PATH"
          idf.py set-target "$CHIP"
          idf.py build

      - name: Check firmware size
        shell: bash
        run: |
          python3 tools/check_partition_sizes.py \
            --partition-table partitions.csv \
            --firmware build/thistle_os.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: thistle-os-firmware-${{ matrix.chip }}
          path: |
            build/thistle_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json

  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (Rust dependency CVE check)
        working-directory: components/kernel_rs
        run: cargo audit

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Semgrep (text output for log visibility)
        run: |
          echo "::group::Semgrep scan results"
          semgrep scan \
            --config auto \
            --config p/default \
            --config .github/semgrep.yml \
            --error \
            --severity ERROR \
            --severity WARNING \
            components/ main/ 2>&1 || SCAN_EXIT=$?
          echo "::endgroup::"
          echo "Semgrep exit code: ${SCAN_EXIT:-0}"

      - name: Run Semgrep (SARIF output for GitHub Security tab)
        if: always()
        run: |
          semgrep scan \
            --config auto \
            --config p/default \
            --config .github/semgrep.yml \
            --sarif --output semgrep-results.sarif \
            components/ main/ || true

      - name: Check for ERROR/WARNING findings
        if: always()
        run: |
          if [ -f semgrep-results.sarif ]; then
            ERRORS=$(python3 -c "
          import json
          d = json.load(open('semgrep-results.sarif'))
          results = d.get('runs', [{}])[0].get('results', [])
          errors = [r for r in results if r.get('level') in ('error', 'warning')]
          for e in errors:
              loc = e.get('locations', [{}])[0].get('physicalLocation', {})
              uri = loc.get('artifactLocation', {}).get('uri', '?')
              line = loc.get('region', {}).get('startLine', '?')
              msg = e.get('message', {}).get('text', '?')[:120]
              print(f'::error file={uri},line={line}::{msg}')
          print(len(errors))
          " 2>/dev/null | tail -1)
            echo "Semgrep ERROR/WARNING findings: $ERRORS"
            if [ "$ERRORS" -gt 0 ] 2>/dev/null; then
              echo "::error::Semgrep found $ERRORS error/warning-level issues!"
              exit 1
            fi
          fi

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Run Trivy (SARIF for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret,misconfig

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  recovery-build:
    name: Build Recovery OS (Rust/esp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libudev-dev pkg-config python3-venv

      - name: Cache Rust ESP toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/.espup
          key: rust-esp-recovery-${{ runner.os }}-v3-rust185-espup016
          # Don't restore from older prefixes — v1 caches contain corrupt
          # espup 0.17.0 state that reproduces the "part" extension error.

      - name: Install Rust + espup + ldproxy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain 1.85.0
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install 1.85.0 --profile minimal
          # Pin espup to 0.16.0 — 0.17.0 (released 2026-04-17) has a regression
          # that aborts with "Unsuported file extension: 'part'" during install.
          if ! command -v espup &> /dev/null || [ "$(espup --version 2>/dev/null | awk '{print $2}')" != "0.16.0" ]; then
            cargo +1.85.0 install espup --version 0.16.0 --locked --force
          fi
          # Clear any stale .part files from prior interrupted runs so espup
          # doesn't try to re-use them.
          find "$HOME/.rustup" "$HOME/.espup" -name '*.part' -delete 2>/dev/null || true
          if [ ! -f "$HOME/export-esp.sh" ]; then
            espup install
          fi
          # ldproxy is the linker wrapper cargo invokes for xtensa-esp32s3-espidf.
          # espup installs the toolchain but not ldproxy; cargo install it explicitly.
          if ! command -v ldproxy &> /dev/null; then
            cargo +1.85.0 install ldproxy --version 0.3.5 --locked
          fi

      - name: Cache recovery target dir
        uses: actions/cache@v6
        with:
          path: recovery/target
          key: recovery-target-${{ runner.os }}-${{ hashFiles('recovery/Cargo.lock', 'recovery/src/**') }}
          restore-keys: recovery-target-${{ runner.os }}-

      - name: Build recovery
        shell: bash
        working-directory: recovery
        run: |
          . "$HOME/.cargo/env"
          . "$HOME/export-esp.sh"
          cargo build --release

      - name: Check recovery size
        run: |
          python3 tools/check_partition_sizes.py \
            --partition-table partitions.csv \
            --recovery recovery/target/xtensa-esp32s3-espidf/release/thistle-recovery

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: thistle-recovery
          path: recovery/target/xtensa-esp32s3-espidf/release/thistle-recovery
