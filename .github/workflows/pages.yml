name: Deploy Pages (Docs + WASM Simulator)

on:
  push:
    branches: [main]
  # The release workflows call this once a release is published: a release
  # made with the workflow's own token starts no `release` event workflow.
  # A caller's event is its tag push, so the deploy job below runs.
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'components/apps_builtin/**'
      - 'components/kernel/**'
      - 'components/kernel_rs/**'
      - 'components/thistle_hal/**'
      - 'components/ui/**'
      - 'simulator/**'
      - 'wasm/**'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_BUILD_JOBS: 4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  THISTLE_CI_JOBS: 4

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs + WASM Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # The tags: the firmware's version is a describe (tools/firmware_version.sh).
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xz-utils

      - name: Cache Rust toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('components/kernel_rs/Cargo.lock') }}
          restore-keys: rust-wasm-${{ runner.os }}-

      - name: Cache Rust WASM build
        uses: actions/cache@v6
        with:
          path: components/kernel_rs/target
          key: rust-wasm-target-${{ runner.os }}-${{ hashFiles('components/kernel_rs/Cargo.lock', 'components/kernel_rs/src/**', 'crates/thistle-tk/src/**') }}
          restore-keys: rust-wasm-target-${{ runner.os }}-

      - name: Cache LVGL
        uses: actions/cache@v6
        with:
          path: managed_components/lvgl__lvgl
          key: lvgl-v9.2.2

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.51
          actions-cache-folder: 'emsdk-cache'

      - name: Install Rust + WASM target
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add wasm32-unknown-emscripten

      - name: Build Rust kernel for WASM
        working-directory: components/kernel_rs
        run: cargo build --release --target wasm32-unknown-emscripten

      - name: Fetch LVGL (needed for WASM build)
        run: |
          mkdir -p managed_components/lvgl__lvgl
          if [ ! -d "managed_components/lvgl__lvgl/src" ]; then
            git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl.git managed_components/lvgl__lvgl
          fi

      - name: Build WASM simulator
        run: |
          cd wasm
          mkdir -p build && cd build
          emcmake cmake ..
          make -j"$THISTLE_CI_JOBS"

      - name: Assemble Pages site
        run: |
          mkdir -p _site

          # Homepage
          cp site/index.html _site/

          # Documentation
          mkdir -p _site/docs
          cp -r docs/* _site/docs/

          # WASM simulator
          mkdir -p _site/simulator
          cp wasm/build/thistle_wasm.html _site/simulator/index.html
          cp wasm/build/thistle_wasm.js _site/simulator/
          cp wasm/build/thistle_wasm.wasm _site/simulator/
          cp wasm/build/thistle_wasm.data _site/simulator/ 2>/dev/null || true

          # Recovery board catalog
          mkdir -p _site/config/boards
          cp sdcard_layout/config/boards/*.json _site/config/boards/
          python3 tools/build_board_catalog.py \
            sdcard_layout/config/boards \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/config/boards" \
            --output _site/catalog.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the catalog builder's dependencies
        run: python3 -m pip install -r tools/requirements.txt

      # The devices' catalog, derived from the releases on every deploy and
      # holding nothing of its own: the newest firmware by version and the
      # newest release of each app, drafts and prereleases left out
      # (tools/build_catalog.py --releases). A docs-only push builds the same.
      - name: Build the store catalog from the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > releases.json
          python3 tools/build_catalog.py --releases releases.json --output _site/store/catalog.json
          cat _site/store/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Called from a release's tag run, this deploys from the tag: the
    # github-pages environment must admit tags v* and *-v* beside main
    # (set up by hand, spec "The release workflows").
    environment:
      name: github-pages
    steps:
      # Pages keeps what it has for a build version it has deployed, and
      # the version is the commit unless told otherwise: an app tagged on
      # the commit of the previous deploy left its release out of the
      # catalog. Each run is a version of its own.
      - name: Deploy
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
