name: thistle_chat
description: Tailnet chat's companion app, for Linux (and Android in ticket 11), over the Dart core.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

# Exact versions: pubspec.lock is committed, and CI builds from it.
dependencies:
  flutter:
    sdk: flutter
  tailnet_chat_core:
    path: ../core
  dbus: 0.8.0
  ffi: 2.2.0
  path_provider: 2.1.6
  flutter_local_notifications: 22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  # SIL Open Font License 1.1 (assets/fonts/*-OFL.txt); variable fonts,
  # their weight set with FontVariation (lib/src/ui/theme.dart).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
